<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c25"/>
      <stop offset="1" stop-color="#06090d"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#g)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#d8f1f3" stroke-opacity=".14"/>
  <!-- the running arc from the page -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#d8f1f3" stroke-width="58" stroke-linecap="round"
          stroke-dasharray="1180 390" transform="rotate(-70 512 512)"/>
  <circle cx="512" cy="512" r="62" fill="#bea989"/>
</svg>
